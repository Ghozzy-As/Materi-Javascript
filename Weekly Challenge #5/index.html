<!doctype html>
<html lang="id" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kantin HSI-BS</title>

<!-- Library CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator.min.css">

<style>
  /* ============ Tema Warna (Light & Dark Mode) ============ */
  :root {
    --ds-text: #292A2E; 
    --ds-text-subtle: #505258; 
    --ds-text-subtlest: #6B6E76; 
    --ds-text-inverse: #FFFFFF;
    --ds-text-selected: #1868DB; 
    --ds-surface: #FFFFFF; 
    --ds-surface-sunken: #F8F8F8; 
    --ds-surface-raised: #FFFFFF;
    --ds-surface-overlay: #FFFFFF; 
    --ds-shadow-raised: 0px 1px 1px rgba(30,31,33,0.25);
    --ds-shadow-overlay: 0px 8px 12px rgba(30,31,33,0.15); 
    --ds-border: rgba(11,18,14,0.14);
    --ds-border-input: #8C8F97; 
    --ds-border-focused: #4688EC; 
    --ds-background-input: #FFFFFF;
    --ds-background-input-hovered: #F8F8F8; 
    --ds-background-neutral: rgba(5,21,36,0.06);
    --ds-background-neutral-hovered: rgba(11,18,14,0.14); 
    --ds-background-selected: #E9F2FE;
    --ds-background-brand-bold: #1868DB;
    --ds-background-accent-blue-subtler: #CFE1FD; --ds-text-accent-blue: #1558BC;
    --ds-background-accent-green-subtler: #BAF3DB; --ds-text-accent-green: #216E4E;
    --ds-background-accent-purple-subtler: #EED7FC; --ds-text-accent-purple: #803FA5;
    --ds-background-accent-yellow-subtler: #F5E989; --ds-text-accent-yellow: #7F5F01;
    --ds-background-accent-teal-subtler: #C6EDFB; --ds-text-accent-teal: #206A83;
    --ds-background-accent-red-subtler: #FFD5D2; --ds-text-accent-red: #AE2E24;
  }

  :root[data-color-mode="dark"] {
    --ds-text: #CECFD2; 
    --ds-text-subtle: #A9ABAF; 
    --ds-text-subtlest: #96999E; 
    --ds-text-inverse: #1F1F21;
    --ds-text-selected: #669DF1; 
    --ds-surface: #1F1F21; 
    --ds-surface-sunken: #121214; 
    --ds-surface-raised: #1D1E20;
    --ds-surface-overlay: #26272A; 
    --ds-shadow-raised: 0px 1px 1px rgba(0,0,0,0.6);
    --ds-shadow-overlay: 0px 8px 12px rgba(0,0,0,0.5); 
    --ds-border: rgba(255,255,255,0.12);
    --ds-border-input: #5A5D66; 
    --ds-border-focused: #669DF1; 
    --ds-background-input: #26272A;
    --ds-background-input-hovered: #2E2F33; 
    --ds-background-neutral: rgba(255,255,255,0.08);
    --ds-background-neutral-hovered: rgba(255,255,255,0.14); 
    --ds-background-selected: #162C4C;
    --ds-background-brand-bold: #669DF1;
    --ds-background-accent-blue-subtler: #123263; --ds-text-accent-blue: #8FB8F6;
    --ds-background-accent-green-subtler: #164B35; --ds-text-accent-green: #7EE2B8;
    --ds-background-accent-purple-subtler: #48245D; --ds-text-accent-purple: #D8A0F7;
    --ds-background-accent-yellow-subtler: #533F04; --ds-text-accent-yellow: #EED12B;
    --ds-background-accent-teal-subtler: #164555; --ds-text-accent-teal: #9DD9EE;
    --ds-background-accent-red-subtler: #5D1F1A; --ds-text-accent-red: #FD9891;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--ds-surface-sunken); color: var(--ds-text); margin: 0; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 20px; transition: background 0.2s, color 0.2s; }
  h1, h2 { margin: 0; color: var(--ds-text); font-weight: 700; }
  svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar */
  .side { background: var(--ds-surface); border-right: 1px solid var(--ds-border); display: flex; flex-direction: column; padding: 16px 12px; gap: 24px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .brand-tile { width: 32px; height: 32px; border-radius: 6px; background: var(--ds-background-brand-bold); color: var(--ds-text-inverse); display: grid; place-items: center; }
  .brand b { display: block; }
  .brand small { display: block; font-size: 11px; color: var(--ds-text-subtlest); }
  .nav-h { font-size: 11px; font-weight: bold; color: var(--ds-text-subtlest); text-transform: uppercase; padding: 0 8px; margin-bottom: 4px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 6px; color: var(--ds-text-subtle); text-decoration: none; font-weight: 500; cursor: pointer; }
  .nav a:hover { background: var(--ds-background-neutral-hovered); color: var(--ds-text); }
  .nav a.active { background: var(--ds-background-selected); color: var(--ds-text-selected); }
  .nav a.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; background: var(--ds-text-selected); }
  .side-foot { margin-top: auto; }
  .btn-theme { width: 100%; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ds-text-subtle); font: inherit; font-weight: 500; cursor: pointer; }
  .btn-theme:hover { background: var(--ds-background-neutral-hovered); color: var(--ds-text); }

  /* Main Content */
  .main { min-width: 0; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 24px; }
  .crumbs { display: flex; gap: 6px; align-items: center; color: var(--ds-text-subtlest); font-size: 13px; margin-bottom: 4px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; line-height: 28px; }
  .sub { color: var(--ds-text-subtle); margin-top: 4px; font-size: 13px; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
  .field > label { font-size: 11px; font-weight: bold; color: var(--ds-text-subtle); text-transform: uppercase; }

  .textfield { position: relative; display: flex; align-items: center; min-height: 36px; background: var(--ds-background-input); border: 1px solid var(--ds-border-input); border-radius: 6px; color: var(--ds-text); }
  .textfield:hover { background: var(--ds-background-input-hovered); }
  .textfield > svg.ic { position: absolute; left: 10px; color: var(--ds-text-subtlest); pointer-events: none; z-index: 1; }
  .textfield input { width: 100%; border: 0; background: transparent; outline: 0; font: inherit; color: inherit; padding: 6px 8px 6px 34px; cursor: pointer; }

  .card { background: var(--ds-surface-raised); box-shadow: var(--ds-shadow-raised); border-radius: 8px; padding: 20px; min-width: 0; }
  .card-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-h h2 { font-size: 15px; line-height: 20px; }
  .card-h small { color: var(--ds-text-subtlest); font-size: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .kpi { display: flex; flex-direction: column; gap: 8px; }
  .kpi-h { display: flex; align-items: center; gap: 8px; color: var(--ds-text-subtle); font-weight: 600; font-size: 13px; }
  .kpi-ico { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .kpi-ico.blue { background: var(--ds-background-accent-blue-subtler); color: var(--ds-text-accent-blue); }
  .kpi-ico.green { background: var(--ds-background-accent-green-subtler); color: var(--ds-text-accent-green); }
  .kpi-ico.purple { background: var(--ds-background-accent-purple-subtler); color: var(--ds-text-accent-purple); }
  .kpi-v { font-size: 28px; line-height: 32px; font-weight: 700; }
  .kpi-c { font-size: 12px; color: var(--ds-text-subtlest); min-height: 16px; }

  .row-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  .chart-wrap { position: relative; height: 240px; }

  .lozenge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
  .lozenge.blue { background: var(--ds-background-accent-blue-subtler); color: var(--ds-text-accent-blue); }
  .lozenge.green { background: var(--ds-background-accent-green-subtler); color: var(--ds-text-accent-green); }
  .lozenge.purple { background: var(--ds-background-accent-purple-subtler); color: var(--ds-text-accent-purple); }
  .lozenge.yellow { background: var(--ds-background-accent-yellow-subtler); color: var(--ds-text-accent-yellow); }
  .lozenge.teal { background: var(--ds-background-accent-teal-subtler); color: var(--ds-text-accent-teal); }
  .lozenge.red { background: var(--ds-background-accent-red-subtler); color: var(--ds-text-accent-red); }

  .promo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .promo li { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ds-border); }
  .promo li:last-child { border-bottom: 0; padding-bottom: 0; }
  .p-emoji { width: 36px; height: 36px; background: var(--ds-background-neutral); border-radius: 6px; display: grid; place-items: center; font-size: 18px; flex: none; }
  .p-body { flex: 1; min-width: 0; }
  .p-body b { display: block; font-weight: 600; font-size: 13px; }
  .p-body small { color: var(--ds-text-subtlest); font-size: 12px; }

  /* Tom Select & Tabulator Integration */
  .ts-wrapper .ts-control { min-height: 36px; padding: 4px 8px; border: 1px solid var(--ds-border-input); border-radius: 6px; background: var(--ds-background-input); color: var(--ds-text); }
  .ts-wrapper .ts-control input { color: var(--ds-text); }
  .ts-wrapper.multi .ts-control > div { background: var(--ds-background-neutral); color: var(--ds-text); border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600; }
  .ts-dropdown { background: var(--ds-surface-overlay); border-radius: 6px; box-shadow: var(--ds-shadow-overlay); border: 1px solid var(--ds-border); color: var(--ds-text); }
  .ts-dropdown .option { color: var(--ds-text); padding: 8px 12px; }
  .ts-dropdown .option.active { background: var(--ds-background-neutral-hovered); }

  .tabulator { border: 0 !important; background: transparent !important; font-size: 13px; }
  .tabulator .tabulator-header { background: transparent !important; border-bottom: 2px solid var(--ds-border) !important; color: var(--ds-text-subtlest); font-weight: bold; }
  .tabulator .tabulator-header .tabulator-col { background: transparent !important; border: 0 !important; color: var(--ds-text-subtlest); }
  .tabulator-row { background: transparent !important; border-bottom: 1px solid var(--ds-border) !important; min-height: 42px; }
  .tabulator-row:hover { background: var(--ds-background-neutral-hovered) !important; }
  .tabulator .tabulator-cell { border: 0 !important; padding: 10px 8px !important; color: var(--ds-text); }
  .tabulator-placeholder { color: var(--ds-text-subtlest); }

  /* Flatpickr Theme Adjustments for Dark Mode */
  .flatpickr-calendar { background: var(--ds-surface-overlay) !important; box-shadow: var(--ds-shadow-overlay) !important; border: 1px solid var(--ds-border) !important; color: var(--ds-text) !important; }
  .flatpickr-day { color: var(--ds-text) !important; }
  .flatpickr-day.flatpickr-disabled, .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: var(--ds-text-subtlest) !important; opacity: 0.4; }
  .flatpickr-months .flatpickr-month, .flatpickr-current-month .flatpickr-monthDropdown-months, .flatpickr-current-month input.cur-year { color: var(--ds-text) !important; fill: var(--ds-text) !important; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .kpis, .row-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-tile">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3.5 9l1.8-5h13.4l1.8 5"/><path d="M3.5 9h17v1.5a2.8 2.8 0 0 1-5.6 0 2.8 2.8 0 0 1-5.8 0 2.8 2.8 0 0 1-5.6 0z"/><path d="M5 13.5V21h14v-7.5"/><path d="M10 21v-4.5h4V21"/></svg>
      </span>
      <div><b>Kantin HSI-BS</b><small>HSI Boarding School</small></div>
    </div>
    <div style="flex:1;">
      <div class="nav-h">Menu</div>
      <nav class="nav">
        <a class="active">
          <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </a>
        <a><svg class="ic" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Produk</a>
        <a><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Laporan</a>
        <a><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Pengaturan</a>
      </nav>
    </div>
    <div class="side-foot">
      <button class="btn-theme" id="btnTheme" type="button">
        <svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="themeLabel">Mode gelap</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <div>
        <div class="crumbs"><span>Kantin HSI-BS</span><span>/</span><span>Dashboard</span></div>
        <h1>Dashboard Kantin</h1>
        <p class="sub" id="subInfo">Pilih kategori untuk menampilkan data</p>
      </div>
      <div class="filters">
        <div class="field">
          <label for="fDate">Tanggal</label>
          <div class="textfield">
            <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            <input id="fDate" placeholder="Pilih rentang tanggal" readonly>
          </div>
        </div>
        <div class="field">
          <label for="fKat">Kategori</label>
          <select id="fKat" multiple placeholder="Pilih kategori..."></select>
        </div>
      </div>
    </header>

    <!-- KPI Box -->
    <section class="kpis">
      <div class="card kpi">
        <div class="kpi-h"><span class="kpi-ico blue">💰</span>Omzet</div>
        <div class="kpi-v" id="kOmzet">-</div>
        <div class="kpi-c" id="cOmzet"></div>
      </div>
      <div class="card kpi">
        <div class="kpi-h"><span class="kpi-ico green">🛍️</span>Item terjual</div>
        <div class="kpi-v" id="kItem">-</div>
        <div class="kpi-c" id="cItem"></div>
      </div>
      <div class="card kpi">
        <div class="kpi-h"><span class="kpi-ico purple">🧾</span>Transaksi</div>
        <div class="kpi-v" id="kTrx">-</div>
        <div class="kpi-c" id="cTrx"></div>
      </div>
    </section>

    <!-- Grafik -->
    <section class="row-2">
      <div class="card">
        <div class="card-h"><h2>Omzet per hari</h2><small>Rupiah</small></div>
        <div class="chart-wrap"><canvas id="cBar"></canvas></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Item per kategori</h2><small>Porsi</small></div>
        <div class="chart-wrap"><canvas id="cDn"></canvas></div>
      </div>
    </section>

    <!-- Tabel Produk & Promo -->
    <section class="row-2">
      <div class="card">
        <div class="card-h"><h2>Produk</h2><small id="prodCount">0 produk</small></div>
        <div id="tProd"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Promo minggu ini</h2><small id="promoCount">0 aktif</small></div>
        <ul class="promo" id="promoList"></ul>
      </div>
    </section>
  </main>
</div>

<!-- Library JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4/dist/l10n/id.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/js/tabulator.min.js"></script>

<!-- Script Terpisah -->
<script src="script.js"></script>
</body>
</html>
